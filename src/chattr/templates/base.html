<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
{% block head %}{% endblock %}
<style>
/* Nord (nordtheme.com): Snow Storm by day, Polar Night by night, Frost for links; the heat map and
   dates keep Caixa's orange (qromaOrange, #FA9237). */
:root { --bg:#eceff4; --panel:#e5e9f0; --fg:#2e3440; --muted:#4c566a; --card:#ffffff; --line:#d8dee9; --sent:#fdefe0; --received:#ffffff; --link:#5e81ac; --accent:#5e81ac; --on-accent:#ffffff; --date:#a85208; --l1:#fde6d0; --l2:#fcc594; --l3:#fa9237; --l4:#c2600c; --on-l4:#ffffff; --shadow:rgba(46,52,64,.12); }
@media (prefers-color-scheme: dark) { :root { --bg:#2e3440; --panel:#3b4252; --fg:#eceff4; --muted:#a7b1c2; --card:#3b4252; --line:#434c5e; --sent:#4a3a2c; --received:#3b4252; --link:#88c0d0; --accent:#88c0d0; --on-accent:#2e3440; --date:#fa9237; --l1:#3d2610; --l2:#7a4513; --l3:#b8641a; --l4:#fa9237; --on-l4:#2e3440; --shadow:rgba(0,0,0,.35); } }
* { box-sizing: border-box; }
body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
header, main { max-width: 52rem; margin: 0 auto; padding: 0 1rem; }
header { padding-top: 1.5rem; }
h1 { margin:0 0 .5rem; font-size:1.6rem; }
a { color: var(--link); }
.years { display:flex; flex-wrap:wrap; gap:.4rem; max-width:52rem; margin:0 auto 1rem; padding:.45rem 1rem; position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); }
.year { padding:.15rem .6rem; border:1px solid var(--line); border-radius:1rem; text-decoration:none; background:var(--card); }
.year.current { background:var(--link); color:var(--bg); border-color:var(--link); }
.calendar { margin:.4rem 0 1rem; }
.months { display:grid; grid-template-columns:repeat(auto-fill,minmax(11rem,1fr)); gap:.75rem; }
.year-title { font-size:1.3rem; margin:2rem 0 .2rem; }
.day { content-visibility:auto; contain-intrinsic-size:auto 20rem; }
.year-block, .date-separator, .entry { scroll-margin-top:4.5rem; } .year-block { padding-top:.1rem; }
.related, .mail-list { margin:.3rem 0; } .related summary, .mail-list summary { cursor:pointer; color:var(--muted); }
.related ul, .mail-list ul { margin:.3rem 0 .5rem; padding-left:1.2rem; }
.end { text-align:center; margin:2rem 0 3rem; }
.attachment a > img { cursor:zoom-in; }
.lightbox { display:none; position:fixed; inset:0; z-index:10; background:rgba(10,12,18,.92); align-items:center; justify-content:center; }
.lightbox.open { display:flex; }
.lightbox img { max-width:92vw; max-height:92vh; border-radius:.3rem; box-shadow:0 0 2rem rgba(0,0,0,.5); }
.lightbox button { position:absolute; font:2.2rem/1 system-ui,sans-serif; color:#fff; background:rgba(255,255,255,.12); border:0; border-radius:.4rem; padding:.2rem .7rem; cursor:pointer; }
.lightbox button:disabled { opacity:.25; cursor:default; }
.lb-prev { left:1rem; top:50%; transform:translateY(-50%); } .lb-next { right:1rem; top:50%; transform:translateY(-50%); } .lb-close { right:1rem; top:1rem; font-size:1.8rem; }
.month { background:var(--card); border:1px solid var(--line); border-radius:.5rem; padding:.5rem; }
.month-name { font-weight:600; font-size:.85rem; margin-bottom:.25rem; }
.grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; font-size:.7rem; text-align:center; }
.grid .d { display:block; border-radius:3px; padding:1px 0; color:var(--muted); text-decoration:none; }
.grid a.d { color:var(--fg); } .grid a.l1 { background:var(--l1); } .grid a.l2 { background:var(--l2); } .grid a.l3 { background:var(--l3); } .grid a.l4 { background:var(--l4); color:var(--on-l4); font-weight:600; }
.date-separator { margin:1.6rem 0 .6rem; font-size:.95rem; color:var(--date); border-bottom:1px solid var(--line); padding-bottom:.2rem; }
.date-separator a { color:var(--date); text-decoration:none; } .date-separator a:hover { text-decoration:underline; }
.entry { background:var(--received); border:1px solid var(--line); border-radius:.6rem; padding:.5rem .75rem; margin:.4rem 0; max-width:85%; }
.entry.sent { background:var(--sent); margin-left:auto; }
.entry.system { max-width:100%; text-align:center; color:var(--muted); font-size:.9rem; background:transparent; border-style:dashed; }
.meta { display:flex; flex-wrap:wrap; gap:.5rem; align-items:baseline; font-size:.8rem; color:var(--muted); }
.author { font-weight:600; color:var(--fg); }
.badge { font-size:.68rem; padding:0 .45rem; border-radius:.6rem; color:#fff; background:#6b7280; }
.s-imessage { background:#5e81ac; } .s-whatsapp { background:#5f8a4c; } .s-messenger { background:#9a6f94; } .s-instagram { background:#bf616a; }
.s-google-voice { background:#4c7f86; } .s-voicemail { background:#c0674a; } .s-mail { background:#4c566a; }
.body { margin-top:.2rem; overflow-wrap:anywhere; }
.attachment img, .attachment video { max-width:100%; max-height:24rem; border-radius:.4rem; display:block; margin:.3rem 0; }
.attachment audio { width:100%; margin:.3rem 0; }
.call, .voicemail { font-weight:600; }
.translation { margin-top:.25rem; padding-left:.6rem; border-left:3px solid var(--l2); color:var(--muted); }
.transcript { margin:.3rem 0 0; padding-left:.6rem; border-left:3px solid var(--line); color:var(--muted); font-style:italic; }
.mark { font-size:.68rem; padding:0 .4rem; border:1px solid var(--line); border-radius:.6rem; }
.reply { font-size:.82rem; color:var(--muted); border-left:3px solid var(--l2); padding-left:.5rem; margin:.2rem 0; }
.reply a { color:var(--muted); }
.edits { margin-top:.25rem; font-size:.82rem; color:var(--muted); } .edits summary { cursor:pointer; }
.edit { padding:.15rem 0 .15rem .6rem; border-left:3px solid var(--line); margin-top:.2rem; }
.reactions { margin-top:.3rem; font-size:.8rem; color:var(--muted); }
.reactions span { margin-right:.6rem; }
.link-preview { display:block; margin-top:.3rem; }

.mail-headers { margin:.3rem 0; font-size:.85rem; color:var(--muted); }
.mail-headers div { margin:0; } .mail-headers b { color:var(--fg); font-weight:600; }
.note { font-size:.8rem; color:var(--muted); }
.index h2 { font-size:1.1rem; margin:1.4rem 0 .4rem; } .index ul { list-style:none; padding:0; margin:0; }
.index li { padding:.15rem 0; } .index .count { color:var(--muted); font-size:.85rem; }
.back { font-size:.85rem; margin:0 0 .3rem; }
.home-button { display:inline-flex; align-items:center; gap:.35rem; margin:.2rem 0 .6rem; padding:.3rem .8rem; border-radius:999px; background:var(--accent); color:var(--on-accent); text-decoration:none; font-size:.85rem; font-weight:600; box-shadow:0 1px 3px var(--shadow); }
.home-button:hover { filter:brightness(1.08); }
.summary { color:var(--muted); margin:0 0 1rem; }
.by-year li, .sources li { display:flex; flex-wrap:wrap; gap:.4rem; align-items:center; padding:.25rem 0; }
.year.home { font-size:.85rem; }
</style>
</head>
<body id="top"{% block body_attrs %}{% endblock %}>
{% block content %}{% endblock %}
{% block island %}{% endblock %}
</body>
</html>
